name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current: the floor is what pyproject promises to support,
        # so it has to stay green, not just the version used for development.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        # No LLM is reachable on a CI runner, which is exactly the fallback
        # path the public deployment uses, so this is the honest configuration.
        env:
          AVS_LLM_ENABLED: "false"
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  benchmark:
    name: Reproduce published benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Regenerate corpus and benchmark
        # Guards the README's numbers: if a change alters the measured results,
        # this job runs it and the diff shows up in the artifact.
        env:
          AVS_LLM_ENABLED: "false"
        run: |
          python scripts/make_test_corpus.py
          python -m app.cli benchmark assets/benchmark --intent auto --csv benchmark_auto.csv
          python -m app.cli benchmark assets/benchmark --intent web_speed --csv benchmark_web.csv

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_*.csv
